name: "Funds: Redeploy Frontend Only"

on:
  workflow_dispatch:

jobs:
  prepare-secrets:
    name: Prepare and Upload Secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare secrets files
        run: |
          set -e
          mkdir -p /tmp/funds/deploy-secrets
          cat > /tmp/funds/deploy-secrets/env-file << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

      - name: Copy secrets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/funds/deploy-secrets/"
          target: "/tmp"
          strip_components: 1

  deploy-funds:
    name: "Deploy: funds (frontend only)"
    runs-on: ubuntu-24.04
    needs: prepare-secrets
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p /var/www/finance-funds

            if [ ! -d "/var/www/finance-funds/.git" ]; then
              git clone -b ${{ github.ref_name }} https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git /var/www/finance-funds
            else
              cd /var/www/finance-funds
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Only touches the funds .env — does not rebuild/restart the
            # shared stack (postgres, redis, backend) or run migrations.
            sed 's/\r$//' /tmp/funds/deploy-secrets/env-file > /var/www/finance-funds/.infra/prod/funds/.env
            rm -rf /tmp/funds/deploy-secrets

            cd /var/www/finance-funds/.infra/prod/funds
            docker compose build
            docker compose up -d

  verify:
    name: "Verify: frontend"
    runs-on: ubuntu-24.04
    needs: deploy-funds
    steps:
      - name: Check container health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /var/www/finance-funds/.infra/prod/funds

            SERVICE="frontend"
            MAX_WAIT=120
            INTERVAL=5
            ELAPSED=0

            echo "Waiting for $SERVICE to be healthy..."
            while true; do
              CONTAINER_ID=$(docker compose ps -q "$SERVICE" 2>/dev/null || true)
              STATUS=$(docker compose ps --format '{{.Service}} {{.State}}' 2>/dev/null | awk -v svc="$SERVICE" '$1==svc {print $2}')
              HEALTH=$([ -n "$CONTAINER_ID" ] && docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "none")
              if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
                echo "$SERVICE is running and healthy."
                break
              fi
              ELAPSED=$((ELAPSED + INTERVAL))
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "ERROR: $SERVICE did not reach healthy state after ${MAX_WAIT}s (state: ${STATUS:-not found}, health: ${HEALTH})"
                echo "--- Last 50 log lines ---"
                docker compose logs --tail=50 "$SERVICE" || true
                exit 1
              fi
              echo "$SERVICE state: '${STATUS:-not found}', health: '${HEALTH}', waiting..."
              sleep $INTERVAL
            done

            echo "--- Last 20 log lines ---"
            docker compose logs --tail=20 "$SERVICE"
