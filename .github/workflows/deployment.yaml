name: "Web App: Deploy to Cloud Server"

on:
  workflow_dispatch:
  # Automatic deployment disabled — re-enable by uncommenting below.
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'src/**'
  #     - '.infra/prod/**'
  #     - '.github/workflows/deployment.yaml'

jobs:
  prepare-secrets:
    name: Prepare and Upload Secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare secrets files
        run: |
          set -e
          mkdir -p /tmp/funds/deploy-secrets
          cat > /tmp/funds/deploy-secrets/env-file << 'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

      - name: Copy secrets to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "/tmp/funds/deploy-secrets/"
          target: "/tmp"
          strip_components: 1

  checkout:
    name: Checkout repo on server
    runs-on: ubuntu-24.04
    needs: prepare-secrets
    steps:
      - name: Sync repo via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p /var/www/finance-funds

            if [ ! -d "/var/www/finance-funds/.git" ]; then
              git clone -b ${{ github.ref_name }} https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git /var/www/finance-funds
            else
              cd /var/www/finance-funds
              git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git checkout ${{ github.ref_name }}
              git reset --hard origin/${{ github.ref_name }}
            fi

  deploy-shared:
    name: "Deploy: shared (postgres, redis, backend)"
    runs-on: ubuntu-24.04
    needs: checkout
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # Copy env file from uploaded secrets (strip Windows CRLF line
            # endings). Runs in parallel with deploy-funds, which reads the
            # same secrets file independently — cleanup-secrets removes it
            # once both are done, so neither job deletes it here.
            sed 's/\r$//' /tmp/funds/deploy-secrets/env-file > /var/www/finance-funds/.infra/prod/shared/.env

            docker image prune -af

            # Creates the shared_network that the funds frontend joins.
            cd /var/www/finance-funds/.infra/prod/shared
            docker compose down
            docker compose build
            docker compose up -d

  migrate-database:
    name: "Migrate: database"
    runs-on: ubuntu-24.04
    needs: deploy-shared
    steps:
      - name: Run EF Core migrations via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # The "migrate" service builds from the Dockerfile's "migrate"
            # target, which reuses the backend's already-restored SDK build
            # stage (see FinanceBackEnd/src/Finance.Api/Dockerfile) — building
            # it here mostly just hits cache from deploy-shared's build.
            # "docker compose run" waits for postgres's healthcheck via
            # depends_on before starting, same as the backend service does.
            cd /var/www/finance-funds/.infra/prod/shared
            docker compose build migrate
            # No --startup-project: Finance.Api doesn't reference
            # Finance.Migrations, so EF would build Finance.Api as the host
            # and then fail to find Finance.Migrations.dll next to it.
            # Finance.Migrations carries its own IDesignTimeDbContextFactory
            # (FinanceDbContextFactory), so it works as its own startup
            # project too — same as Scripts/UpdateDatabase.ps1 already does.
            docker compose run --rm migrate database update --project src/Finance.Migrations --context FinanceDbContext

  deploy-funds:
    name: "Deploy: funds (frontend)"
    runs-on: ubuntu-24.04
    needs: checkout
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            # Runs in parallel with deploy-shared — reads the secrets file
            # independently rather than relying on deploy-shared's copy.
            sed 's/\r$//' /tmp/funds/deploy-secrets/env-file > /var/www/finance-funds/.infra/prod/funds/.env

            cd /var/www/finance-funds/.infra/prod/funds
            docker compose down
            docker compose build
            docker compose up -d

            # Write deploy timestamp for verify jobs to detect stale checks
            date +%s > /tmp/finance-funds-deploy-ts

  cleanup-secrets:
    name: Clean up uploaded secrets
    runs-on: ubuntu-24.04
    needs: [deploy-shared, deploy-funds]
    steps:
      - name: Remove secrets file via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            rm -rf /tmp/funds/deploy-secrets

  verify:
    name: "Verify: ${{ matrix.service }}"
    runs-on: ubuntu-24.04
    needs: [migrate-database, deploy-funds]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: postgres
            dir: shared
          - service: redis
            dir: shared
          - service: backend
            dir: shared
          - service: frontend
            dir: funds
    steps:
      - name: Check container health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /var/www/finance-funds/.infra/prod/${{ matrix.dir }}

            SERVICE="${{ matrix.service }}"
            MAX_WAIT=120
            INTERVAL=5
            ELAPSED=0

            echo "Waiting for $SERVICE to be healthy..."
            while true; do
              CONTAINER_ID=$(docker compose ps -q "$SERVICE" 2>/dev/null || true)
              STATUS=$(docker compose ps --format '{{.Service}} {{.State}}' 2>/dev/null | awk -v svc="$SERVICE" '$1==svc {print $2}')
              HEALTH=$([ -n "$CONTAINER_ID" ] && docker inspect --format '{{.State.Health.Status}}' "$CONTAINER_ID" 2>/dev/null || echo "none")
              if [ "$STATUS" = "running" ] && [ "$HEALTH" = "healthy" ]; then
                echo "$SERVICE is running and healthy."
                break
              fi
              ELAPSED=$((ELAPSED + INTERVAL))
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "ERROR: $SERVICE did not reach healthy state after ${MAX_WAIT}s (state: ${STATUS:-not found}, health: ${HEALTH})"
                echo "--- Last 50 log lines ---"
                docker compose logs --tail=50 "$SERVICE" || true
                exit 1
              fi
              echo "$SERVICE state: '${STATUS:-not found}', health: '${HEALTH}', waiting..."
              sleep $INTERVAL
            done

            echo "--- Last 20 log lines ---"
            docker compose logs --tail=20 "$SERVICE"
