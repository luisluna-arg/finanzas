services:
  frontend:
    build:
      context: ../../../FinanceFrontEnd/FinanceFunds
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5200:5200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5200/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: shared_network
    external: true
