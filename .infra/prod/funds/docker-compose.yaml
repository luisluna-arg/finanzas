name: finance-funds

services:
  frontend:
    container_name: finance-funds-frontend
    build:
      context: ../../../FinanceFrontEnd/FinanceFunds
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI}
        VITE_API_URL: https://api.${APP_DOMAIN}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
        VITE_ALLOW_INSECURE_API: ${VITE_ALLOW_INSECURE_API}
    environment:
      - PORT=3000
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.finance-funds.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.finance-funds.entrypoints=websecure"
      - "traefik.http.routers.finance-funds.tls.certresolver=le-resolver"
      - "traefik.http.services.finance-funds.loadbalancer.server.port=3000"

networks:
  traefik_network:
    external: true
