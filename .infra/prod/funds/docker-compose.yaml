name: finance-funds

services:
  frontend:
    container_name: finance-funds-frontend
    build:
      context: ../../../FinanceFrontEnd/FinanceFunds
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Auth0 config and secrets (AUTH0_*, USER_SESSION_SECRET) come from .env;
      # BASE_URL, API_URL and REDIS_URL are set here because they depend on
      # APP_DOMAIN / internal service names, which .env doesn't know about.
      - PORT=3000
      - APP_DOMAIN=${APP_DOMAIN}
      - BASE_URL=https://${APP_DOMAIN}
      - API_URL=http://finance-shared-backend:80
      - REDIS_URL=redis://:${REDIS_PASSWORD}@finance-shared-redis:6379
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - traefik_network
      - shared_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.finance-funds.rule=Host(`${APP_DOMAIN}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.finance-funds.entrypoints=websecure"
      - "traefik.http.routers.finance-funds.tls.certresolver=le-resolver"
      - "traefik.http.services.finance-funds.loadbalancer.server.port=3000"

networks:
  traefik_network:
    external: true
  # Lets this container reach finance-shared-redis and finance-shared-backend
  # directly by service name, instead of the public api.${APP_DOMAIN} hostname.
  shared_network:
    external: true
