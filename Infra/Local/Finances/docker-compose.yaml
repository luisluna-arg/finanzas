services:
  frontend:
    build:
      context: ../../../FinanceFrontEnd/FinanceRemix
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=5100
    ports:
      - "5100:5100"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5100"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# No volumes needed for frontend-only services

networks:
  default:
    name: shared_network
    external: true
